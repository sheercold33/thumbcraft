[package]
name = "thumbcraft"
version = "0.1.0"
edition = "2021"
description = "Thumbnail viewer and cataloging studio with Ghostscript integration, CDR thumbnail & keyword extraction, and modern format support"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "tiff", "ico", "tga", "pnm", "qoi", "dds", "hdr", "exr"
] }
jxl-oxide = "0.12"
jxl-encoder = { version = "0.3.4", default-features = false, features = ["std"] }
oxideav-avif = "0.0.18"
oxideav-webp = { version = "0.3.2", default-features = false }
resvg = "0.45"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
roxmltree = "0.20"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
walkdir = "2"
open = "5"
rayon = "1"
wgpu = "24"
pollster = "0.4"

[profile.dev]
opt-level = "s"
debug = false
strip = "symbols"
lto = "thin"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
